name: Keep warm

# A free-tier instance sleeps after ~15 minutes idle, and waking it costs the
# host 30-60 seconds staring at nothing. Time-to-first-challenge is one of the
# four fun-signals in §11 of the source of truth, and party momentum does not
# survive that wait — so we keep the stage warm.
#
# Set the KEEP_WARM_URL repository variable to the deployed /health endpoint.
# If you move to a paid instance this whole workflow becomes unnecessary.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.KEEP_WARM_URL }}" ]; then
            echo "KEEP_WARM_URL is not set — nothing to keep warm yet."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 "${{ vars.KEEP_WARM_URL }}"
