name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

      # The domain suite is the one that matters: fairness, phase transitions,
      # and determinism. It runs in about a second because it touches no I/O.
      - run: dotnet test tests/SpinSpell.Domain.Tests --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SpinSpell.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/SpinSpell.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
